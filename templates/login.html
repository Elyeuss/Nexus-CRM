{% extends 'base.html' %}
{% block content %}
<div class="login-card">
  <h1>Log in</h1>
  <form method="post">
    <label>Email
      <input type="email" name="email" required>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button type="submit">Log in</button>
  </form>
</div>
{% endblock %}
